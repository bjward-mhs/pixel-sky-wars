<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trench Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="kicker">FIELD STUDY // 01</p>
        <h1>Trench Weather</h1>
      </div>
      <div class="status"><span class="status-light"></span>RAIN FRONT / ACTIVE <strong id="version-readout">v0.7.0</strong></div>
    </header>

    <section class="briefing" aria-label="Game controls">
      <div class="briefing-copy">
        <p class="label">NO. 14 // FRONTLINE SIMULATION</p>
        <p id="objective">Advance through the trenches. Keep the original line.</p>
      </div>
      <div class="controls">
        <button id="regenerate" type="button"><span aria-hidden="true">↻</span> New battle</button>
        <span class="hint"><kbd>A</kbd><kbd>D</kbd> move <span class="dot">•</span> <kbd>W</kbd> jump <span class="dot">•</span> <kbd>F</kbd> fire <span class="dot">•</span> <kbd>E</kbd> enter gun / click</span>
      </div>
    </section>

    <section class="viewport-wrap">
      <div class="viewport-meta"><span id="front-readout">FRONT LINE / 01</span><span id="artillery-readout">RIFLE READY</span><span id="seed-readout">SEED 000000</span></div>
      <div class="canvas-frame">
        <canvas id="world" width="640" height="360" aria-label="A rainy pixel-art trench landscape"></canvas>
        <div class="scanline" aria-hidden="true"></div>
      </div>
    </section>

    <footer class="legend">
      <span><i class="swatch mud"></i> MUD / SOIL</span>
      <span><i class="swatch timber"></i> TIMBER</span>
      <span><i class="swatch soldier"></i> ALLIED UNIT</span>
      <span><i class="swatch enemy"></i> OPPOSING UNIT</span>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
